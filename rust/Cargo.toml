[package]
name = "vnx"
version = "0.10.5"
edition = "2021"
# Pinned, not measured against a feature this crate needs today: it was raised
# to 1.77 for `f64::round_ties_even` at the writer boundary, and the writer no
# longer rounds. Left where it is rather than lowered on a guess.
rust-version = "1.77"
description = "Reader and writer for the VNX trail interchange format"
license = "MIT"

[dependencies]
# ⚠ `float_roundtrip` IS LOAD-BEARING, NOT A TUNING KNOB. Without it serde_json
# parses `-3.6712345678901235` to bits c00d5eb03aa8431d where `str::parse`
# gives …431e — one bit out. That literal is the longitude in
# `corpus/accept/full-precision-coordinate`, the case that exists to prove a
# reader does not lose precision, so dropping the feature fails the corpus.
serde_json = { version = "1", features = ["float_roundtrip"] }
# DEFLATE, for reading and writing container entries (SPEC 7).
flate2 = "1"

[dev-dependencies]
