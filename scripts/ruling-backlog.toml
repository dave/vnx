# THIS FILE IS BUILT TO BE THROWN AWAY. DELETE IT WHEN IT IS EMPTY.
#
# It is a work list, not a document. It records rulings that have been made and
# have not yet reached SPEC.md, and `check-ruling-backlog.py` fails while any
# entry is outstanding. When the last entry goes, delete this file and the
# script beside it — a permanent ledger of what the specification used to be
# missing is drafting history, and this repository does not keep drafting
# history.
#
# WHY IT EXISTS. A ruling and the specification text are separate artefacts with
# a lag between them, so a library can be correct against one and wrong against
# the other, and neither is obviously the authority at the moment somebody looks.
# Two seats lost a ruling that way on 2026-09-09: one implemented a reading, the
# ruling landed elsewhere, and the spec still read as it had — so checking the
# spec confirmed the wrong answer. The backlog is not a discipline problem once
# a check can fail on it.
#
# ADDING AN ENTRY. `section` is the SPEC.md heading number the text must land
# in. `requires` is a phrase that must appear inside that section once the
# ruling is written down — pick a phrase that could only appear if the rule
# were actually stated, not a word the section already uses for another reason.
# The check tells you when a phrase is already present, so a badly chosen one
# fails loudly rather than passing vacuously.
#
# REMOVING AN ENTRY. Delete it when the text lands. Do not weaken `requires` to
# make the check pass; that publishes the problem instead of solving it.
#
# The check scopes a phrase to the named section and NOT its subsections, so if
# a ruling legitimately belongs in a subsection, change `section` — that is the
# entry being corrected, not the check being weakened.
#
# `./scripts/check-ruling-backlog.py --self-test` proves the check can fail and
# can pass, including that a phrase living only in a subsection still fails.

[[ruling]]
id = "write-tier"
ruled = "2026-09-09"
section = "8"
requires = "`write/`"
statement = """
The corpus has a fifth kind of case. `write/` holds a document and exactly the
bytes a conforming WRITER emits for it, and is the only tier that applies the
emit-boundary rules of 4.5.4 — every other tier re-renders. A runner MUST assert
that the input is not already the written form, and that the written form is a
fixed point of the writer.
"""
